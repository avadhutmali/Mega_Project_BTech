name: Publish IdleGrid DDP CPU image

on:
  push:
    branches: [main]
    paths:
      - "agent/training-worker/**"
      - ".github/workflows/publish-training-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CPU/Gloo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/training-worker/Dockerfile
          push: true
          tags: ghcr.io/avadhutmali/idlegrid-pytorch-cpu:latest
