name: Build and Release IdleGrid EXEs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package IdleGridAgent (Creates ZIP)
        shell: cmd
        working-directory: agent
        run: |
          call package.bat

      - name: Compile Setup Installer (Creates Setup EXE)
        shell: cmd
        working-directory: agent/installer
        run: |
          call Compile-Setup.bat

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IdleGrid Latest Release (Build ${{ github.run_number }})
          body: "Automated build triggered by latest push to main."
          make_latest: true
          files: |
            agent/dist/IdleGridAgent-windows.zip
            agent/installer/IdleGrid-Setup.exe
