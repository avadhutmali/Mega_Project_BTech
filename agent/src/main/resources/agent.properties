# =============================================================================
# IdleGrid Agent Configuration
# =============================================================================
# All values here are defaults bundled into the JAR.
# Override any property by placing an agent.properties file in the directory
# where you run the JAR (working directory takes priority).
# =============================================================================

# Master server base URL (no trailing slash)
master.url=http://10.40.18.213:9090

# Node ID used in all communication with the Master.
# Leave blank to auto-generate a UUID on first run; it will be saved to .node_id
# in the working directory so it survives restarts.
node.id=

# SSH command shown to users when they select this node in the dashboard.
# Leave empty to generate: ssh <OS username>@<node IP> -p <ssh.port>
# Use SSH keys; never put a password in this value.
ssh.command=
ssh.username=
ssh.port=22

# ── Heartbeat ──────────────────────────────────────────────────────────────
# How often (seconds) to POST /nodes/heartbeat to the Master.
# Keep between 3–5s as specified in the design; lower = more network traffic.
heartbeat.interval.seconds=3

# ── Job Polling ────────────────────────────────────────────────────────────
# How often (seconds) to poll GET /agent/{nodeId}/assignment.
job.poll.interval.seconds=5

# ── Idle Detection ─────────────────────────────────────────────────────────
# Time (seconds) of keyboard/mouse inactivity before the node is reported IDLE.
# BOINC's default is 300s; Condor uses a similar "keyboard idle" threshold.
# Tune this based on the empirical idle_transitions.log data (Step 4 in plan).
idle.threshold.seconds=300

# How often (seconds) to run the idle detection check.
idle.check.interval.seconds=10

# ── Docker ─────────────────────────────────────────────────────────────────
# Fallback image when a job payload does not specify one.
docker.default.image=ghcr.io/avadhutmali/idlegrid-ubuntu-worker:latest

# ── Filesystem ─────────────────────────────────────────────────────────────
# Local directory where per-job workspaces are created and bind-mounted.
# On Windows with Docker Desktop, Docker can access paths under C:\ directly.
workspace.dir=./workspace

# Directory for all agent log files (agent.log, idle_transitions.log, sessions/).
log.dir=./logs
