server.port=9090
spring.application.name=idlegrid-backend
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Rendezvous Registration (JSONBin.io) ───────────────────────────────────────
# Set JSONBIN_API_KEY in the Master process environment. The project bin ID is the default;
# override it with JSONBIN_BIN_ID. Make the bin public for reads, or set a read-only
# RENDEZVOUS_READ_KEY on Agents. Set JSONBIN_MASTER_URL if IP auto-detection picks the wrong NIC.
rendezvous.jsonbin.api-key=${JSONBIN_API_KEY:}
rendezvous.jsonbin.bin-id=${JSONBIN_BIN_ID:6ab4d071ffd5d160532973dd}
rendezvous.master-url=${JSONBIN_MASTER_URL:}
