server.port=9090
spring.application.name=idlegrid-backend
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Rendezvous Registration (JSONBin.io) ───────────────────────────────────────
# Used so Agents on any subnet can auto-discover this Master.
# 1. Go to https://jsonbin.io → sign up free
# 2. Create a bin with content: {"masterUrl": "http://placeholder:9090"}
# 3. Make the bin PUBLIC (so agents can read without a key)
# 4. Copy your API Key and Bin ID below
rendezvous.jsonbin.api-key=${JSONBIN_API_KEY:}
rendezvous.jsonbin.bin-id=${JSONBIN_BIN_ID:}
