server.port=9090
spring.application.name=idlegrid-backend
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Rendezvous Registration (JSONBin.io) ───────────────────────────────────────
# This project bin is public, so publishing and Agent reads need no API keys.
# The project bin ID is the default; override it with JSONBIN_BIN_ID.
rendezvous.jsonbin.bin-id=${JSONBIN_BIN_ID:6ab4d071ffd5d160532973dd}
rendezvous.master-url=${JSONBIN_MASTER_URL:}

# Student client accounts; comma-separated username:password entries.
# Example: IDLEGRID_CLIENT_USERS=student1:replace-me,student2:replace-me
idlegrid.client.users=${IDLEGRID_CLIENT_USERS:}
idlegrid.client.max-users=${IDLEGRID_CLIENT_MAX_USERS:50}
